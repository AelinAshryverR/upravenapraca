<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahrávanie súborov</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f3f3f3;
            margin-top: 5px;
            border-radius: 5px;
        }
        .progress {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            border-radius: 5px;
            transition: width 0.3s;
        }
        button {
            padding: 5px 10px;
            margin-top: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input[type="text"] {
            width: 90%;
            padding: 5px;
        }
        footer {
            margin-top: 50px;
            padding: 10px;
            font-size: 14px;
            color: #555;
            background-color: #f4f4f4;
        }
        .youtube-link-display {
            margin-top: 5px;
            word-break: break-all;
        }
        .youtube-link-display a {
            color: #007bff;
            text-decoration: none;
        }
        .youtube-link-display a:hover {
            text-decoration: underline;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:nth-child(odd) {
            background-color: white;
        }
        .file-info {
            margin-top: 5px;
            font-size: 12px;
            color: #555;
        }
        .status-message {
            margin-top: 5px;
            font-size: 12px;
            min-height: 20px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Tabuľka pre nahrávanie súborov</h1>

    <table>
        <thead>
            <tr>
                <th>Meno</th> 
                <th>Záverečná práca</th>
                <th>Youtube link</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Riadky budú vygenerované dynamicky -->
        </tbody>
    </table>

    <footer>
        <p>Vytvoril: Lukáš Miščík</p>
        <p>Pre potreby druhé krúžku upravil: Milan Hricko</p>
        <p>Vyučujúci: doc. Ing. Jaroslav Kultan, PhD.</p>
    </footer>

    <script>
        const tbody = document.getElementById('tableBody');
        const personNames = [
            "Sofia M.", "Lukáš M.", "Martina M.", "Bence N.", "Evelyn N.", "Fanni N.", "Sophia N.",
            "Veronika N.", "Lea N.", "Valentína O.", "Alexandra P.", "Soňa P.", "Filip P.", "Vasylyna P.",
            "Katarína P.", "Kristína S.", "Natália S.", "Ema S.", "Nikola S.", "Daniela S.", "Claudia S."
        ];

        for (let i = 1; i <= 21; i++) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td id="personName_${i}">${personNames[i-1]}</td>
                <td>
                    <button onclick="document.getElementById('fileInput_${i}_1').click();">Nahrať súbor</button>
                    <input type="file" id="fileInput_${i}_1">
                    <div class="progress-bar">
                        <div class="progress" id="progress_${i}_1"></div>
                    </div>
                    <div id="fileUrl_${i}_1" class="file-info"></div>
                    <div id="uploadStatus_${i}_1" class="status-message"></div>
                    <button id="removeFile_${i}_1" disabled>Odstrániť súbor</button>
                </td>
                <td>
                    <input type="text" id="youtubeLinkInput_${i}" placeholder="Vložte YouTube link">
                    <div class="youtube-link-display" id="youtubeLinkDisplay_${i}"></div>
                    <div id="youtubeStatus_${i}" class="status-message"></div>
                    <button id="saveYouTubeLink_${i}">Uložiť link</button>
                    <button id="removeYouTubeLink_${i}" disabled>Odstrániť link</button>
                </td>
            `;
            tbody.appendChild(row);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-storage.js";

        // Firebase konfigurácia
        const firebaseConfig = {
            apiKey: "AIzaSyDeR53hgZuwcQUBtlflIiicP-mUth-meBA",
            authDomain: "zaverecna-praca-6ff35.firebaseapp.com",
            projectId: "zaverecna-praca-6ff35",
            storageBucket: "zaverecna-praca-6ff35.appspot.com",
            messagingSenderId: "638697811438",
            appId: "1:638697811438:web:fe1625e5a21f3701bf72ff"
        };

        // Inicializácia Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const db = getFirestore(app);

        console.log("Firebase initialized successfully");

        // Anonymné prihlásenie
        signInAnonymously(auth)
            .then(() => {
                console.log("Anonymous authentication successful");
                initializeAppLogic();
            })
            .catch(error => {
                console.error("Authentication error:", error);
                alert("Chyba pri prihlásení: " + error.message);
            });

        function initializeAppLogic() {
            // Funkcia pre nahrávanie súboru
            window.uploadFile = function(personId, column, file) {
                console.log(`Starting upload for person ${personId}, file: ${file.name}`);
                const statusElement = document.getElementById(`uploadStatus_${personId}_${column}`);
                statusElement.textContent = "Začínam nahrávanie...";
                statusElement.className = "status-message";
                
                const storageRef = ref(storage, `uploads/person_${personId}/file_${column}/${file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, file);

                uploadTask.on('state_changed',
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        console.log(`Upload progress: ${progress}%`);
                        document.getElementById(`progress_${personId}_${column}`).style.width = progress + '%';
                        statusElement.textContent = `Nahrávanie: ${Math.round(progress)}%`;
                    },
                    (error) => {
                        console.error('Upload error:', error);
                        statusElement.textContent = "Chyba pri nahrávaní: " + error.message;
                        statusElement.className = "status-message error";
                    },
                    () => {
                        console.log('Upload complete, getting download URL');
                        statusElement.textContent = "Preberám URL...";
                        
                        getDownloadURL(uploadTask.snapshot.ref)
                            .then((downloadURL) => {
                                console.log('Download URL:', downloadURL);
                                return setDoc(doc(db, "files", `file_${personId}_${column}`), {
                                    url: downloadURL,
                                    fileName: file.name,
                                    timestamp: new Date().toISOString()
                                });
                            })
                            .then(() => {
                                console.log('File metadata saved to Firestore');
                                statusElement.textContent = "Nahrávanie úspešné!";
                                statusElement.className = "status-message success";
                                
                                document.getElementById(`fileUrl_${personId}_${column}`).innerHTML = `
                                    <a href="${downloadURL}" target="_blank">${file.name}</a>
                                    <div>Veľkosť: ${formatFileSize(file.size)}</div>
                                `;
                                document.getElementById(`removeFile_${personId}_${column}`).disabled = false;
                            })
                            .catch((error) => {
                                console.error('Error after upload:', error);
                                statusElement.textContent = "Chyba po nahrávaní: " + error.message;
                                statusElement.className = "status-message error";
                            });
                    }
                );
            };

            // Funkcia pre odstránenie súboru
            window.removeFile = function(personId, column) {
                if (!confirm('Naozaj chcete odstrániť tento súbor?')) return;
                
                const statusElement = document.getElementById(`uploadStatus_${personId}_${column}`);
                statusElement.textContent = "Odstraňujem súbor...";
                statusElement.className = "status-message";
                
                const fileRef = doc(db, "files", `file_${personId}_${column}`);
                getDoc(fileRef)
                    .then((docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.fileName) {
                                const storageRef = ref(storage, `uploads/person_${personId}/file_${column}/${data.fileName}`);
                                return deleteObject(storageRef)
                                    .then(() => setDoc(fileRef, { url: "", fileName: "" }))
                                    .then(() => {
                                        document.getElementById(`fileUrl_${personId}_${column}`).innerHTML = '';
                                        document.getElementById(`progress_${personId}_${column}`).style.width = '0%';
                                        document.getElementById(`removeFile_${personId}_${column}`).disabled = true;
                                        statusElement.textContent = "Súbor bol odstránený";
                                        statusElement.className = "status-message success";
                                    });
                            }
                        }
                        return Promise.resolve();
                    })
                    .catch((error) => {
                        console.error('Delete error:', error);
                        statusElement.textContent = "Chyba pri odstraňovaní: " + error.message;
                        statusElement.className = "status-message error";
                    });
            };

            // Funkcia pre uloženie YouTube linku
            window.saveYouTubeLink = function(personId) {
                const youtubeLink = document.getElementById(`youtubeLinkInput_${personId}`).value.trim();
                const statusElement = document.getElementById(`youtubeStatus_${personId}`);
                
                if (!youtubeLink) {
                    statusElement.textContent = "Prosím vložte YouTube odkaz";
                    statusElement.className = "status-message error";
                    return;
                }

                // Validácia YouTube linku
                let videoId = '';
                if (youtubeLink.includes('youtube.com/watch?v=')) {
                    videoId = youtubeLink.split('v=')[1].split('&')[0];
                } else if (youtubeLink.includes('youtu.be/')) {
                    videoId = youtubeLink.split('youtu.be/')[1].split('?')[0];
                } else {
                    statusElement.textContent = "Neplatný YouTube odkaz";
                    statusElement.className = "status-message error";
                    return;
                }

                statusElement.textContent = "Ukladám odkaz...";
                statusElement.className = "status-message";

                const embedUrl = `https://www.youtube.com/embed/${videoId}`;
                const displayUrl = `https://www.youtube.com/watch?v=${videoId}`;

                setDoc(doc(db, "youtubeLinks", `person_${personId}`), {
                    link: displayUrl,
                    embedUrl: embedUrl,
                    personId: personId,
                    timestamp: new Date().toISOString()
                })
                .then(() => {
                    document.getElementById(`youtubeLinkDisplay_${personId}`).innerHTML = `
                        <a href="${displayUrl}" target="_blank">${displayUrl}</a>
                    `;
                    document.getElementById(`removeYouTubeLink_${personId}`).disabled = false;
                    statusElement.textContent = "Odkaz uložený!";
                    statusElement.className = "status-message success";
                })
                .catch((error) => {
                    console.error('Error saving YouTube link:', error);
                    statusElement.textContent = "Chyba pri ukladaní: " + error.message;
                    statusElement.className = "status-message error";
                });
            };

            // Funkcia pre odstránenie YouTube linku
            window.removeYouTubeLink = function(personId) {
                if (!confirm('Naozaj chcete odstrániť tento YouTube odkaz?')) return;
                
                const statusElement = document.getElementById(`youtubeStatus_${personId}`);
                statusElement.textContent = "Odstraňujem odkaz...";
                statusElement.className = "status-message";
                
                const youtubeLinkRef = doc(db, "youtubeLinks", `person_${personId}`);
                deleteDoc(youtubeLinkRef)
                    .then(() => {
                        document.getElementById(`youtubeLinkInput_${personId}`).value = '';
                        document.getElementById(`youtubeLinkDisplay_${personId}`).innerHTML = '';
                        document.getElementById(`removeYouTubeLink_${personId}`).disabled = true;
                        statusElement.textContent = "Odkaz odstránený!";
                        statusElement.className = "status-message success";
                    })
                    .catch((error) => {
                        console.error('Error removing YouTube link:', error);
                        statusElement.textContent = "Chyba pri odstraňovaní: " + error.message;
                        statusElement.className = "status-message error";
                    });
            };

            // Pomocná funkcia pre formátovanie veľkosti súboru
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // Načítanie existujúcich dát pri načítaní stránky
            window.addEventListener('DOMContentLoaded', () => {
                console.log('DOM fully loaded, initializing event listeners');
                
                // Inicializácia event listenerov pre každý riadok
                for (let i = 1; i <= 21; i++) {
                    const personId = i;
                    
                    // Event listener pre výber súboru
                    document.getElementById(`fileInput_${personId}_1`).addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            if (file.size > 50 * 1024 * 1024) { // 50MB limit
                                const statusElement = document.getElementById(`uploadStatus_${personId}_1`);
                                statusElement.textContent = "Súbor je príliš veľký (max 50MB)";
                                statusElement.className = "status-message error";
                                return;
                            }
                            uploadFile(personId, 1, file);
                        }
                    });

                    // Event listener pre odstránenie súboru
                    document.getElementById(`removeFile_${personId}_1`).addEventListener('click', () => {
                        removeFile(personId, 1);
                    });

                    // Event listener pre uloženie YouTube linku
                    document.getElementById(`saveYouTubeLink_${personId}`).addEventListener('click', () => {
                        saveYouTubeLink(personId);
                    });

                    // Event listener pre odstránenie YouTube linku
                    document.getElementById(`removeYouTubeLink_${personId}`).addEventListener('click', () => {
                        removeYouTubeLink(personId);
                    });

                    // Načítanie existujúceho súboru
                    const fileRef = doc(db, "files", `file_${personId}_1`);
                    getDoc(fileRef)
                        .then((docSnap) => {
                            if (docSnap.exists() && docSnap.data().url) {
                                const data = docSnap.data();
                                document.getElementById(`fileUrl_${personId}_1`).innerHTML = `
                                    <a href="${data.url}" target="_blank">${data.fileName || 'Súbor'}</a>
                                `;
                                document.getElementById(`removeFile_${personId}_1`).disabled = false;
                            }
                        })
                        .catch((error) => {
                            console.error('Error loading file info:', error);
                        });

                    // Načítanie existujúceho YouTube linku
                    const youtubeLinkRef = doc(db, "youtubeLinks", `person_${personId}`);
                    getDoc(youtubeLinkRef)
                        .then((docSnap) => {
                            if (docSnap.exists() && docSnap.data().link) {
                                const data = docSnap.data();
                                document.getElementById(`youtubeLinkInput_${personId}`).value = data.link;
                                document.getElementById(`youtubeLinkDisplay_${personId}`).innerHTML = `
                                    <a href="${data.link}" target="_blank">${data.link}</a>
                                `;
                                document.getElementById(`removeYouTubeLink_${personId}`).disabled = false;
                            }
                        })
                        .catch((error) => {
                            console.error('Error loading YouTube link:', error);
                        });
                }
            });
        }
    </script>
</body>
</html>
