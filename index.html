<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuľka YouTube odkazov</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        button {
            padding: 5px 10px;
            margin-top: 10px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 90%;
            padding: 5px;
        }
        footer {
            margin-top: 50px;
            padding: 10px;
            font-size: 14px;
            color: #555;
            background-color: #f4f4f4;
        }
        .youtube-link-display {
            margin-top: 5px;
            word-break: break-all;
        }
        .youtube-link-display a {
            color: #007bff;
            text-decoration: none;
        }
        .youtube-link-display a:hover {
            text-decoration: underline;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:nth-child(odd) {
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Tabuľka YouTube odkazov</h1>

    <table>
        <thead>
            <tr>
                <th>Meno</th>
                <th>YouTube link</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Riadky budú vygenerované dynamicky -->
        </tbody>
    </table>

    <footer>
        <p>Vytvoril: Lukáš Miščík</p>
        <p>Pre potreby druhé krúžku upravil: Milan Hricko </p>
        <p>Vyučujúci: doc. Ing. Jaroslav Kultan, PhD.</p>
    </footer>

    <!-- Skript na vygenerovanie tabuľky -->
    <script>
        const tbody = document.getElementById('tableBody');
        for (let i = 1; i <= 21; i++) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td id="personName_${i}">Person ${i}</td>
                <td>
                    <input type="text" id="youtubeLinkInput_${i}" placeholder="Vložte YouTube link">
                    <div class="youtube-link-display" id="youtubeLinkDisplay_${i}"></div>
                    <button id="saveYouTubeLink_${i}">Uložiť link</button>
                    <button id="removeYouTubeLink_${i}">Odstrániť link</button>
                </td>
            `;
            tbody.appendChild(row);
        }
    </script>

    <!-- Firebase a logika -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeR53hgZuwcQUBtlflIiicP-mUth-meBA",
            authDomain: "zaverecna-praca-6ff35.firebaseapp.com",
            projectId: "zaverecna-praca-6ff35",
            messagingSenderId: "638697811438",
            appId: "1:638697811438:web:fe1625e5a21f3701bf72ff"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).catch(error => {
            console.error("Anonymous sign-in error:", error);
        });

        function saveYouTubeLink(personId) {
            const youtubeLink = document.getElementById(`youtubeLinkInput_${personId}`).value.trim();
            if (!youtubeLink) {
                alert('Prosím vložte YouTube odkaz');
                return;
            }

            let displayUrl = youtubeLink;
            if (youtubeLink.includes('youtube.com/watch?v=')) {
                const videoId = youtubeLink.split('v=')[1].split('&')[0];
                displayUrl = `https://www.youtube.com/watch?v=${videoId}`;
            }

            setDoc(doc(db, "youtubeLinks", `person_${personId}`), {
                link: youtubeLink,
                displayUrl,
                personId
            }, { merge: true }).then(() => {
                document.getElementById(`youtubeLinkDisplay_${personId}`).innerHTML =
                    `<a href="${displayUrl}" target="_blank">${displayUrl}</a>`;
                alert('YouTube odkaz uložený!');
            });
        }

        function removeYouTubeLink(personId) {
            const youtubeLinkRef = doc(db, "youtubeLinks", `person_${personId}`);
            setDoc(youtubeLinkRef, {
                link: "",
                displayUrl: ""
            }, { merge: true }).then(() => {
                document.getElementById(`youtubeLinkInput_${personId}`).value = '';
                document.getElementById(`youtubeLinkDisplay_${personId}`).innerHTML = '';
                alert('YouTube odkaz odstránený!');
            });
        }

        async function loadYouTubeLinks() {
            for (let i = 1; i <= 21; i++) {
                const docRef = doc(db, "youtubeLinks", `person_${i}`);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().link) {
                    document.getElementById(`youtubeLinkInput_${i}`).value = docSnap.data().link;
                    document.getElementById(`youtubeLinkDisplay_${i}`).innerHTML =
                        `<a href="${docSnap.data().displayUrl || docSnap.data().link}" target="_blank">${docSnap.data().displayUrl || docSnap.data().link}</a>`;
                }
            }
        }

        window.onload = () => {
            const personNames = [
                "Ako natočiť video?", "Ako nahrať video na youtube?", "Bielková N.", "Hanáková K.", "Evelyn N.", "Hanzelová P.", "Hanková L.",
                "Gdúlová J.", "Dobiašová A.", "Frajkorová S. "Fritschová T.", "Gajdoš M..", "Guttenová T.", "Hrebíček M",
                "Hricko M.", "Hričovská M.", "Hrnčiar M.", "Hvizdošová E.", "Chlpíková D.", "Chudá M.", "Ihnátová T.", "Ilková K.", "Ivšaková K.", "Janovcová N."  
            ];

            for (let i = 1; i <= 21; i++) {
                document.getElementById(`personName_${i}`).innerText = personNames[i - 1];

                document.getElementById(`saveYouTubeLink_${i}`).addEventListener('click', () => {
                    saveYouTubeLink(i);
                });

                document.getElementById(`removeYouTubeLink_${i}`).addEventListener('click', () => {
                    removeYouTubeLink(i);
                });
            }

            loadYouTubeLinks();
        };
    </script>
</body>
</html>
